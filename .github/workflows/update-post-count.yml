name: Update Post Count Badge

on:
  schedule:
    - cron: '0 0 * * *'    # 매일 00:00 UTC = 한국시간 오전 9시에 자동 실행
  workflow_dispatch:        # Actions 탭에서 수동으로도 실행 가능
  repository_dispatch:      # 블로그 레포에서 신호를 보내면 즉시 실행 (선택 사항, 아래 ②번과 세트)
    types: [blog-post-published]

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Checkout blog repo
        uses: actions/checkout@v4
        with:
          repository: sungjin-dev/sungjin-dev.github.io
          path: blog
          token: ''   # public 레포를 완전 익명으로 클론 (다른 레포 토큰 충돌 방지)

      - name: Debug - blog checkout 상태 확인
        run: |
          echo "--- blog 폴더 구조 ---"
          find blog -maxdepth 2 -type d
          echo "--- _posts 안 파일 개수(디버그) ---"
          find blog/_posts -type f | wc -l

      - name: Count real Jekyll posts
        run: |
          # _posts 아래 모든 카테고리 폴더를 재귀적으로 뒤지되,
          # "YYYY-MM-DD-제목.md" 형식(진짜 Jekyll 포스트)만 카운트한다.
          # test.md 처럼 날짜 접두사 없는 파일은 자동으로 제외된다.
          COUNT=$(find blog/_posts -type f -regextype posix-extended \
            -regex '.*/[0-9]{4}-[0-9]{2}-[0-9]{2}-.*\.(md|markdown)$' | wc -l | tr -d ' ')
          echo "Total posts found: $COUNT"

          sed -i -E "s/Total_Posts-[0-9]+/Total_Posts-${COUNT}/g" README.md

      - name: Commit & Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto update post count badge [skip ci]" && git push)
